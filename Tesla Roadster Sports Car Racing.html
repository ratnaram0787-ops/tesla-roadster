<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tesla Roadster Sports Car Racing</title>
<style>
:root{color-scheme:dark;--bg:#0b0d14;--panel:rgba(14,16,26,.82);--ink:#f3f4f8;--mute:#9aa0b4;--red:#ff2a3a;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));transition:box-shadow .2s}
#vig.nit{box-shadow:inset 0 0 120px rgba(80,170,255,.45)}
.hide{display:none!important}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.panel{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:28px 30px;width:min(420px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:clamp(24px,5vw,34px);letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
h1 em{color:var(--red);font-style:normal}
h2{margin:0 0 14px;text-transform:uppercase;letter-spacing:.08em}
p.sub{margin:0 0 22px;color:var(--mute);font-size:14px}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{display:block;width:100%;margin:10px 0 0;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:.15s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn.main{background:linear-gradient(135deg,#ff2a3a,#c3081a);border:0;box-shadow:0 8px 24px rgba(255,42,58,.4)}
.btn.main:hover{filter:brightness(1.12);transform:translateY(-1px)}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:14px;text-align:left;gap:12px}
.row input[type=range]{width:55%;accent-color:var(--red)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.sw{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw button.on{border-color:#fff}
#cname{color:var(--mute);font-size:14px;margin-bottom:10px;height:18px}
#loading{background:var(--bg);z-index:50;flex-direction:column;transition:opacity .5s}
#loading .barw{width:240px;height:4px;background:var(--line);border-radius:4px;margin-top:18px;overflow:hidden}
#loading .barw i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px)}
.top{display:flex;gap:10px;align-items:flex-start}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:90px}
.stat small,.speedo small{display:block;color:var(--mute);font-size:10px;letter-spacing:.14em}
.stat b{font-size:clamp(16px,3.4vw,22px);font-variant-numeric:tabular-nums}
.btns{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px}
.speedo{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:190px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.speedo b{font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.speedo span{color:var(--mute);margin-left:6px;font-size:13px}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:6px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ff2a3a)}
.bar.n i{background:linear-gradient(90deg,#2b8cff,#7ee7ff)}
#pop{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-size:26px;font-weight:800;color:#ffd24a;text-shadow:0 2px 12px #000;opacity:0}
#pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px)}}
#touch{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);pointer-events:none;z-index:5}
#touch>div{display:flex;gap:10px;pointer-events:auto;touch-action:none}
#touch button{width:74px;height:74px;border-radius:50%;border:2px solid var(--line);background:rgba(20,22,34,.6);font-weight:800;font-size:13px;touch-action:none}
#touch button.d{background:rgba(255,42,58,.55)}
#touch .tr{flex-direction:column-reverse;align-items:flex-end;margin-bottom:84px}
.big{font-size:44px;font-weight:800;margin:4px 0}
.crash{color:var(--red)}
@media(max-width:700px){.speedo{bottom:calc(100px + env(safe-area-inset-bottom));width:150px}.speedo b{font-size:36px}}
</style></head><body>
<canvas id="gl"></canvas><canvas id="fx"></canvas><div id="vig"></div>

<div id="hud" class="hide">
 <div class="top">
  <div class="stat"><small>SCORE</small><b id="sc">0</b></div>
  <div class="stat"><small>DISTANCE</small><b id="di">0.0 km</b></div>
  <div class="stat"><small>BEST</small><b id="bs">0</b></div>
  <div class="btns"><button class="ib" id="bMute" title="Mute (M)">🔊</button><button class="ib" id="bPause" title="Pause (P)">❚❚</button></div>
 </div>
 <div class="speedo"><b id="kmh">0</b><span>km/h</span><div class="bar"><i id="sbar"></i></div><small>NITRO</small><div class="bar n"><i id="nbar"></i></div></div>
 <div id="pop"></div>
</div>

<div id="touch" class="hide">
 <div><button data-k="L">◀</button><button data-k="R">▶</button></div>
 <div class="tr"><button data-k="G">GAS</button><button data-k="B">BRAKE</button><button data-k="N">NITRO</button></div>
</div>

<div id="menu" class="ov hide"><div class="panel">
 <h1>Tesla <em>Roadster</em></h1><p class="sub">Sports Car Racing</p>
 <button class="btn main" id="bPlay">Play</button>
 <button class="btn" id="bGarage">Garage</button>
 <button class="btn" id="bSettings">Settings</button>
 <p class="sub" style="margin:18px 0 0;font-size:12px">W/↑ accelerate · S/↓ brake · A/D or ←/→ steer · Space nitro · P pause · M mute</p>
</div></div>

<div id="settings" class="ov hide"><div class="panel"><h2>Settings</h2>
 <div class="row"><span>Volume</span><input type="range" id="sVol" min="0" max="1" step=".05"></div>
 <div class="row"><span>Music</span><input type="checkbox" id="sMus"></div>
 <div class="row"><span>Shadows</span><input type="checkbox" id="sShd"></div>
 <div class="row"><span>High resolution</span><input type="checkbox" id="sHi"></div>
 <button class="btn main" id="sBack">Back</button>
</div></div>

<div id="garage" class="ov hide" style="justify-content:flex-start"><div class="panel"><h2>Garage</h2>
 <p class="sub" style="margin-bottom:12px">Choose your paint</p><div class="sw" id="sw"></div><div id="cname"></div>
 <button class="btn main" id="gBack">Done</button>
</div></div>

<div id="pause" class="ov hide" style="background:rgba(0,0,0,.45)"><div class="panel"><h2>Paused</h2>
 <button class="btn main" id="pRes">Resume</button><button class="btn" id="pMenu">Main menu</button></div></div>

<div id="over" class="ov hide"><div class="panel"><h2 class="crash">Crashed!</h2>
 <div class="sub" style="margin:0">SCORE</div><div class="big" id="oSc">0</div>
 <p class="sub" id="oInfo"></p>
 <button class="btn main" id="oRe">Restart</button><button class="btn" id="oMenu">Main menu</button></div></div>

<div id="loading" class="ov"><h1>Tesla <em>Roadster</em></h1><p class="sub" id="ltxt" style="margin-top:8px">Loading 3D engine…</p><div class="barw"><i id="lbar"></i></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
function fail(m){$('ltxt').textContent=m;$('lbar').style.width='0'}
if(typeof THREE==='undefined'){fail('Could not load the 3D engine. Check your connection and reload.');return}
const S={vol:.7,music:true,shadows:true,hi:true,color:0,best:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('rdstr')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rdstr',JSON.stringify(S))}catch(e){}};
const COLORS=[['Rosso Red',0xc8101a],['Midnight Blue',0x1c3dd0],['Pearl White',0xeeeeee],['Stealth Black',0x16161c],['Solar Yellow',0xf5b800]];
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'})}catch(e){fail('WebGL is not available in this browser.');return}
renderer.shadowMap.enabled=S.shadows;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,.1,900);
const FOG=0xe9a27c;scene.fog=new THREE.Fog(FOG,70,420);
// sky
(function(){const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#16224d');gr.addColorStop(.45,'#7a5d9c');gr.addColorStop(.62,'#f2a074');gr.addColorStop(.7,'#ffd2a0');gr.addColorStop(1,'#e9a27c');g.fillStyle=gr;g.fillRect(0,0,4,256);
const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t})();
// env reflections
try{const es=new THREE.Scene(),sg=new THREE.SphereGeometry(50,24,16),pos=sg.attributes.position,cols=[];
const top=new THREE.Color(0x4a66b0),hor=new THREE.Color(0xffc08a),bot=new THREE.Color(0x30343c);
for(let i=0;i<pos.count;i++){const y=pos.getY(i)/50,c=y>0?hor.clone().lerp(top,Math.pow(y,.6)):hor.clone().lerp(bot,Math.min(1,-y*3));cols.push(c.r,c.g,c.b)}
sg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
es.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
const sun=new THREE.Mesh(new THREE.SphereGeometry(6,8,8),new THREE.MeshBasicMaterial({color:0xfff2d0}));sun.position.set(-20,15,-45);es.add(sun);
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es).texture}catch(e){}
scene.add(new THREE.HemisphereLight(0xffcfa8,0x3a4558,.6));
const sunL=new THREE.DirectionalLight(0xffd0a0,1.5);sunL.position.set(-14,26,10);sunL.castShadow=true;
sunL.shadow.mapSize.set(1024,1024);const sc=sunL.shadow.camera;sc.left=-16;sc.right=16;sc.top=16;sc.bottom=-16;sc.near=1;sc.far=80;sunL.shadow.bias=-.0006;scene.add(sunL);
$('lbar').style.width='25%';$('ltxt').textContent='Building the world…';

// ---------- world ----------
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9},o||{}));
const bx=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,m,x,y,z,p){const o=new THREE.Mesh(bx,m);o.scale.set(w,h,d);o.position.set(x,y,z);(p||scene).add(o);return o}
const road=box(16,.2,1200,mat(0x2b2c32,{roughness:.8}),0,-.1,-300);road.receiveShadow=true;
const grass=box(1400,.2,1400,mat(0x34502c),0,-.25,-300);grass.receiveShadow=true;
const white=new THREE.MeshBasicMaterial({color:0xf2f2f2}),yel=new THREE.MeshBasicMaterial({color:0xffc400});
box(.2,.02,1200,white,-7.7,.01,-300);box(.2,.02,1200,white,7.7,.01,-300);
const rail=mat(0xb8bcc4,{metalness:.7,roughness:.4});
[-8.6,8.6].forEach(x=>{box(.18,.5,1200,rail,x,.55,-300).castShadow=true;box(.25,.7,1200,mat(0x444,{}),x,.2,-300)});
const movers=[];const L=480;
function mover(o,mul,len,z0){o.position.z=z0;movers.push({o,mul,L:len||L});scene.add(o)}
for(const x of [-4,0,4])for(let i=0;i<40;i++){const d=box(.22,.02,4,white,x,.012,0,{add(){}});scene.remove(d);d.position.set(x,.012,0);mover(d,1,L,30-i*12)}
// trees
const trunkM=mat(0x5a3b22),leafM=[mat(0x2f6b34),mat(0x3b7d3a),mat(0x275a30)];
const trG=new THREE.CylinderGeometry(.25,.35,2,6),coG=new THREE.ConeGeometry(1.7,3.6,7);
for(let i=0;i<90;i++){const g=new THREE.Group(),t=new THREE.Mesh(trG,trunkM);t.position.y=1;g.add(t);
 const s=.8+Math.random()*.9;[0,1].forEach(j=>{const c=new THREE.Mesh(coG,leafM[i%3]);c.position.y=3+j*1.5;c.scale.setScalar(1-j*.35);c.castShadow=true;g.add(c)});
 g.scale.setScalar(s);g.position.x=(i%2?1:-1)*(11+Math.random()*30);mover(g,1,L,30-Math.random()*L)}
// lamp posts
const poleM=mat(0x777b84,{metalness:.6}),lampM=new THREE.MeshBasicMaterial({color:0xfff0c0});
for(let i=0;i<24;i++){const g=new THREE.Group(),s=i%2?1:-1;g.add(box(.15,7,.15,poleM,0,3.5,0,g));g.add(box(1.4,.12,.12,poleM,-s*.6,7,0,g));g.add(box(.5,.12,.3,lampM,-s*1.2,6.92,0,g));g.position.x=s*9.6;mover(g,1,L,30-(i>>1)*40)}
// mountains
const mtG=new THREE.ConeGeometry(1,1,6),mtM=[mat(0x4a4d78,{flatShading:true}),mat(0x5b4b78,{flatShading:true}),mat(0x3d5a6e,{flatShading:true})];
for(let i=0;i<16;i++){const m=new THREE.Mesh(mtG,mtM[i%3]),r=70+Math.random()*80,h=70+Math.random()*110;m.scale.set(r,h,r);m.position.set((i%2?1:-1)*(150+Math.random()*180),h/2-4,0);mover(m,.15,700,30-Math.random()*700)}
// city
function winTex(){const c=document.createElement('canvas');c.width=32;c.height=64;const g=c.getContext('2d');g.fillStyle='#10131c';g.fillRect(0,0,32,64);
 for(let y=2;y<64;y+=6)for(let x=3;x<32;x+=7){if(Math.random()<.45){g.fillStyle=Math.random()<.7?'#ffd98a':'#9fd8ff';g.fillRect(x,y,3,3)}}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t}
for(let i=0;i<46;i++){const w=12+Math.random()*14,h=25+Math.random()*(i%5?60:110),t=winTex();t.repeat.set(w/6,h/10);
 const m=mat(0x8a93a8,{map:t,emissiveMap:t,emissive:0xffffff,emissiveIntensity:.55,roughness:.6}),b=new THREE.Mesh(bx,m);b.scale.set(w,h,w);
 b.position.set((i%2?1:-1)*(46+Math.random()*80),h/2,0);mover(b,1,L,30-Math.random()*L)}
$('lbar').style.width='55%';

// ---------- player car ----------
function profGeo(pts,w){const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
 const g=new THREE.ExtrudeGeometry(sh,{depth:w,bevelEnabled:true,bevelThickness:.07,bevelSize:.07,bevelSegments:2});g.translate(0,0,-w/2);g.rotateY(Math.PI/2);return g}
const bodyMat=new THREE.MeshPhysicalMaterial({color:COLORS[S.color][1],metalness:.55,roughness:.22,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.3});
const car=new THREE.Group(),wheels=[],fronts=[];
const tailMat=new THREE.MeshStandardMaterial({color:0x550008,emissive:0xff0818,emissiveIntensity:.8});
(function(){
 const body=new THREE.Mesh(profGeo([[2.2,.32],[2.2,.6],[1.4,.74],[.7,.86],[.35,1.05],[-.5,1.08],[-1.2,.9],[-2.2,.85],[-2.2,.32]],1.8),bodyMat);body.castShadow=true;car.add(body);
 const glass=new THREE.Mesh(profGeo([[.55,.9],[.3,1.08],[-.5,1.17],[-1.1,.94]],1.5),new THREE.MeshPhysicalMaterial({color:0x080c14,metalness:.9,roughness:.05,clearcoat:1,envMapIntensity:1.5}));car.add(glass);
 const dk=mat(0x101012,{roughness:.5});
 box(1.9,.08,.4,dk,0,.3,-2.1,car);box(1.8,.1,.5,dk,0,.3,2.0,car);
 box(1.9,.06,.5,bodyMat,0,1.0,2.15,car);box(.08,.2,.08,dk,.6,.92,2.0,car);box(.08,.2,.08,dk,-.6,.92,2.0,car);
 [-1,1].forEach(s=>{box(.5,.07,.06,new THREE.MeshBasicMaterial({color:0xdff4ff}),s*.62,.58,-2.27,car);box(.1,.1,.4,dk,s*1.0,.78,-.6,car)});
 box(1.6,.09,.05,tailMat,0,.72,2.27,car);
 const tire=mat(0x0c0c0e,{roughness:.8}),rim=new THREE.MeshStandardMaterial({color:0xcfd3da,metalness:1,roughness:.2});
 const tg=new THREE.CylinderGeometry(.4,.4,.32,20),rg=new THREE.CylinderGeometry(.27,.27,.34,10);
 [[-1,-1.35],[1,-1.35],[-1,1.35],[1,1.35]].forEach(([sx,z],i)=>{const piv=new THREE.Group();piv.position.set(sx*.95,.4,z);
  const spin=new THREE.Group();const t=new THREE.Mesh(tg,tire),r=new THREE.Mesh(rg,rim);t.castShadow=true;[t,r].forEach(m=>{m.rotation.z=Math.PI/2;spin.add(m)});
  for(let k=0;k<5;k++){const sp=box(.34,.06,.5,dk,0,0,0,spin);sp.rotation.x=k*Math.PI/5}
  piv.add(spin);car.add(piv);wheels.push(spin);if(i<2)fronts.push(piv)});
})();
const flames=[-1,1].map(s=>{const f=new THREE.Mesh(new THREE.ConeGeometry(.2,1.8,8),new THREE.MeshBasicMaterial({color:0x7ee7ff,transparent:true,opacity:.85}));f.rotation.x=Math.PI/2;f.position.set(s*.5,.45,3.2);f.visible=false;car.add(f);return f});
scene.add(car);

// ---------- traffic ----------
const TC=[0x2b6cb0,0xdddddd,0x222831,0x7a7f8a,0x2f855a,0xd69e2e,0x8a3b3b,0x5b4b9a];
const tailT=new THREE.MeshBasicMaterial({color:0xff2233}),glassT=mat(0x0d1118,{metalness:.8,roughness:.2});
let traffic=[];
function mkTraffic(){const r=Math.random(),m=mat(TC[(Math.random()*TC.length)|0],{metalness:.4,roughness:.4}),g=new THREE.Group();let w=1.85,l=4.3,kind=0;
 if(r>.8){kind=2;w=2.4;l=9;box(w,2.7,l*.72,mat(0xe4e6ea),0,1.75,l*.14,g).castShadow=true;box(w,1.8,l*.22,m,0,1.3,-l*.39,g).castShadow=true;box(w*.9,.8,.05,glassT,0,1.8,-l*.5,g);box(w*.8,.15,.05,tailT,0,.7,l*.5+.02,g)}
 else{const h=r>.5?1.05:.7;if(r>.5){kind=1;w=2;l=4.8}box(w,h,l,m,0,.35+h/2,0,g).castShadow=true;box(w*.86,.55,l*.5,glassT,0,.35+h+.27,.2,g);box(w*.8,.14,.05,tailT,0,.35+h*.7,l/2+.02,g)}
 return{g,w,l,kind}}
function mkBarrier(){const g=new THREE.Group();box(2.2,.9,1,mat(0xff6a00),0,.45,0,g).castShadow=true;box(2.22,.2,1.02,mat(0xffffff),0,.6,0,g);return{g,w:2.2,l:1,kind:3}}
const LANES=[-6,-2,2,6];

// ---------- particles ----------
const parts=[],pg=new THREE.SphereGeometry(.5,6,6);
for(let i=0;i<90;i++){const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));m.visible=false;scene.add(m);parts.push({m,life:0,max:1,v:new THREE.Vector3(),grow:1,a:1})}
let pi=0;
function emit(x,y,z,vx,vy,vz,col,size,life,grow,a){const p=parts[pi++%parts.length];p.m.position.set(x,y,z);p.v.set(vx,vy,vz);p.m.material.color.setHex(col);p.m.scale.setScalar(size);p.life=p.max=life;p.grow=grow;p.a=a;p.m.visible=true}

// ---------- state ----------
let state='menu',paused=false,speed=14,px=2,vx=0,nitro=100,dist=0,bonus=0,score=0,crashT=0,crashDir=1,shake=0,time=0,drift=0,spawnT=0,nitroOn=false,camOrb=0,yaw=0;
const keys={},T={L:0,R:0,N:0,B:0,G:0};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.code==='KeyP'||e.code==='Escape')togglePause();if(e.code==='KeyM')toggleMute();if(e.code==='KeyR'&&state==='over')startGame()});
addEventListener('keyup',e=>{keys[e.code]=0});addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();T[k]=1;b.classList.add('d')},off=e=>{e.preventDefault();T[k]=0;b.classList.remove('d')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));b.addEventListener('contextmenu',e=>e.preventDefault())});
const inp=()=>({acc:keys.KeyW||keys.ArrowUp||T.G,brk:keys.KeyS||keys.ArrowDown||T.B,l:keys.KeyA||keys.ArrowLeft||T.L,r:keys.KeyD||keys.ArrowRight||T.R,nit:keys.Space||T.N});

function show(id,v){$(id).classList.toggle('hide',!v)}
function hideAll(){['menu','settings','garage','over','pause'].forEach(i=>show(i,false))}
function toMenu(){hideAll();show('hud',false);show('touch',false);show('menu',true);state='menu';paused=false;clearTraffic();speed=14;px=0;vx=0;car.rotation.set(0,0,0);car.position.y=0}
function clearTraffic(){traffic.forEach(t=>scene.remove(t.g));traffic=[]}
function startGame(){initAudio();if(AC&&AC.state==='suspended')AC.resume();hideAll();clearTraffic();show('hud',true);show('touch',isTouch);
 speed=22;px=2;vx=0;nitro=100;dist=0;bonus=0;score=0;drift=0;spawnT=1;shake=0;car.rotation.set(0,0,0);car.position.y=0;state='play';paused=false}
function togglePause(){if(state!=='play')return;paused=!paused;show('pause',paused)}
let pc=0;function pop(t){const p=$('pop');p.textContent=t;p.classList.remove('go');void p.offsetWidth;p.classList.add('go')}

// ---------- audio ----------
let AC,master,eo1,eo2,eF,eG,mBus,muted=false,step=0,nbuf;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);
 eo1=AC.createOscillator();eo1.type='sawtooth';eo2=AC.createOscillator();eo2.type='triangle';eF=AC.createBiquadFilter();eF.type='lowpass';eG=AC.createGain();eG.gain.value=0;
 eo1.connect(eF);eo2.connect(eF);eF.connect(eG);eG.connect(master);eo1.start();eo2.start();mBus=AC.createGain();mBus.connect(master);
 nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 applyVol();setInterval(music,190)}catch(e){AC=null}}
function applyVol(){if(master)master.gain.value=muted?0:S.vol;$('bMute').textContent=muted?'🔇':'🔊'}
function toggleMute(){muted=!muted;applyVol()}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,type,dur,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(dest);o.start();o.stop(AC.currentTime+dur)}
const prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
function music(){if(!AC||!S.music||muted||paused||state==='over')return;const bar=(step>>4)&3,s=step&15,ch=prog[bar];
 if(s%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,AC.currentTime);o.frequency.exponentialRampToValueAtTime(40,AC.currentTime+.12);g.gain.setValueAtTime(.35,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.15);o.connect(g);g.connect(mBus);o.start();o.stop(AC.currentTime+.16)}
 if(s%2===0)tone(mf(ch[0]-24),'sawtooth',.25,.09,mBus);tone(mf(ch[s%3]+12),'square',.12,.025,mBus);if(s%4===2)tone(mf(ch[2]+24),'triangle',.3,.03,mBus);step++}
function crashSnd(){if(!AC)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='lowpass';f.frequency.setValueAtTime(2500,AC.currentTime);f.frequency.exponentialRampToValueAtTime(100,AC.currentTime+.8);g.gain.setValueAtTime(.9,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.9);s.connect(f);f.connect(g);g.connect(master);s.start()}
function audioUpdate(i){if(!AC)return;const t=AC.currentTime,run=state==='play'||state==='menu'||state==='crash';
 eo1.frequency.setTargetAtTime(45+speed*1.7+(nitroOn?14:0),t,.08);eo2.frequency.setTargetAtTime(160+speed*10,t,.08);eF.frequency.setTargetAtTime(350+speed*16,t,.1);
 eG.gain.setTargetAtTime(run&&!paused?(state==='play'?.05+(i&&i.acc?.05:0):.03):0,t,.1)}

// ---------- game logic ----------
function gameOver(){state='over';const nb=score>S.best;if(nb){S.best=score;save()}
 $('oSc').textContent=score;$('oInfo').textContent=(nb?'New best score! ':'Best: '+S.best+' · ')+(dist/1000).toFixed(2)+' km driven';hideAll();show('over',true);show('touch',false)}
function crash(){state='crash';crashT=0;crashDir=Math.random()<.5?-1:1;shake=1;crashSnd();
 for(let i=0;i<40;i++){const a=Math.random()*6.28;emit(px,.8,0,Math.cos(a)*9,Math.random()*7,Math.sin(a)*9-5,i%3?0xff8a1a:0x444444,.3+Math.random()*.5,.6+Math.random()*.8,2.5,.9)}}
function spawn(){const lane=LANES[(Math.random()*4)|0],z=-300;
 let occ=new Set();for(const t of traffic){if(t.z<-200&&t.z>-380)occ.add(t.lane);if(t.lane===lane&&Math.abs(t.z-z)<45)return}
 if(occ.size>=3&&!occ.has(lane))return;
 const t=Math.random()<.14?mkBarrier():mkTraffic();t.lane=lane;t.x=lane;t.z=z;t.v=t.kind===3?0:15+Math.random()*16+Math.min(10,score/700);
 t.g.position.set(t.x,0,z);t.hit=false;scene.add(t.g);traffic.push(t)}
function updTraffic(dt,live){
 for(let i=traffic.length-1;i>=0;i--){const t=traffic[i],pz=t.z;t.z+=(speed-t.v)*dt;t.g.position.z=t.z;
  if(t.z>25||t.z<-430){scene.remove(t.g);traffic.splice(i,1);continue}
  if(!live)continue;
  if(Math.abs(px-t.x)<(.95+t.w/2)*.92&&Math.abs(t.z)<(2.2+t.l/2)*.92){crash();return}
  if(pz<0&&t.z>=0&&!t.hit&&Math.abs(px-t.x)<3.4&&t.kind!==3){t.hit=true;const b=speed>55?50:25;bonus+=b;pop('NEAR MISS +'+b)}}}
function play(dt,k){
 nitroOn=!!k.nit&&nitro>0&&speed>8;
 const cap=nitroOn?100:72;let a=0;
 if(k.acc)a+=28*Math.pow(Math.max(0,1-speed/cap),.8)+(nitroOn?20:0);
 a-=2.5+speed*speed*.0004;if(k.brk)a-=42;
 speed=Math.max(0,Math.min(speed+a*dt,105));if(speed>72&&!nitroOn)speed-=9*dt;
 if(nitroOn)nitro=Math.max(0,nitro-24*dt);else if(!k.nit)nitro=Math.min(100,nitro+5*dt);
 const s=(k.r?1:0)-(k.l?1:0),lat=11.5-3*speed/100,tg=s*lat*Math.min(1,speed/10);
 const rate=(s&&speed>45)?(k.brk?2.4:3.6):7;vx+=(tg-vx)*Math.min(1,rate*dt);px+=vx*dt;
 if(Math.abs(px)>7.1){const sg=Math.sign(px);px=sg*7.1;if(Math.abs(vx)>2||speed>20){speed=Math.max(0,speed-18*dt);if(Math.random()<.6)emit(px+sg*.9,.3,0,sg*2,3,Math.random()*6,0xffc040,.12,.35,-.2,1)}vx=-sg*Math.abs(vx)*.2}
 drift+=((s&&speed>38?1:0)*(k.brk?1.5:1)*(speed/70)-drift)*Math.min(1,dt*5);
 const ty=-vx*.03-s*drift*.32;yaw+=(ty-yaw)*Math.min(1,dt*8);car.rotation.y=yaw;car.rotation.z=vx*.006;
 car.position.y=Math.sin(time*40)*.004*Math.min(1,speed/40);
 if((drift>.55||(k.brk&&speed>40))&&speed>25)for(const sx of[-.9,.9])emit(px+sx,.25,1.5,(Math.random()-.5)*2,.8,0,0xdddddd,.35,.8,2.2,.55);
 // difficulty & traffic
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.3,1.3-score/3000)*(40/Math.max(speed,25))}
 updTraffic(dt,true);dist+=speed*dt;score=Math.floor(dist/10)+bonus}
function drawFX(sp,nit){const c=$('fx'),g=c.getContext('2d'),W=c.width,H=c.height;g.clearRect(0,0,W,H);const k=Math.max(0,(sp-40)/60);if(k<=0)return;
 g.lineCap='round';const n=28,m=Math.min(W,H);for(let i=0;i<n;i++){const a=Math.random()*6.283,r0=m*(.38+Math.random()*.3),len=m*(.1+Math.random()*.25)*k,ca=Math.cos(a),sa=Math.sin(a);
  g.strokeStyle=nit?'rgba(150,220,255,'+(.1+k*.3)+')':'rgba(255,255,255,'+(.05+k*.2)+')';g.lineWidth=1+Math.random()*2;g.beginPath();g.moveTo(W/2+ca*r0*1.4,H/2+sa*r0);g.lineTo(W/2+ca*(r0+len)*1.4,H/2+sa*(r0+len));g.stroke()}}
const last={};function setT(id,v){if(last[id]!==v){last[id]=v;$(id).textContent=v}}
let lt=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-lt)/1000);lt=now;if(paused)dt=0;time+=dt;
 const i=inp();
 if(state==='play')play(dt,i);
 else if(state==='crash'){speed*=Math.exp(-2.5*dt);crashT+=dt;car.rotation.y+=crashDir*dt*7*Math.exp(-crashT*1.8);car.rotation.z=crashDir*Math.min(.4,crashT)*.3;updTraffic(dt,false);if(crashT>1.4)gameOver()}
 else if(state==='over'){speed*=Math.exp(-3*dt);updTraffic(dt,false)}
 else speed=14;
 if(state!=='play')nitroOn=false;
 for(const m of movers){m.o.position.z+=speed*dt*m.mul;if(m.o.position.z>30)m.o.position.z-=m.L}
 car.position.x=px;
 wheels.forEach(w=>w.rotation.x-=speed*dt/.4);fronts.forEach(f=>f.rotation.y=-(state==='play'?((i.r?1:0)-(i.l?1:0)):0)*.4);
 tailMat.emissiveIntensity=(i.brk&&state==='play')?3.5:.8;
 flames.forEach(f=>{f.visible=nitroOn;if(nitroOn){f.scale.set(1,.7+Math.random()*.7,1);f.position.z=3.1+f.scale.y*.9*.5}});
 // particles
 for(const p of parts){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.m.visible=false;continue}p.m.position.x+=p.v.x*dt;p.m.position.y+=p.v.y*dt;p.m.position.z+=(p.v.z+speed)*dt;p.m.scale.addScalar(p.grow*dt);p.m.material.opacity=Math.max(0,p.life/p.max)*p.a}
 // camera
 shake=Math.max(0,shake-dt*1.6);const sk=shake*.5+(nitroOn?.03:0)+speed*.0003;
 let tx,ty,tz,lx,ly,lz,fov;
 if(state==='menu'||(!$('garage').classList.contains('hide'))){const gar=!$('garage').classList.contains('hide');camOrb+=dt*(gar?.35:.2);const r=gar?6.2:8.5;tx=Math.sin(camOrb)*r;tz=Math.cos(camOrb)*r;ty=gar?1.9:2.4;lx=0;ly=.7;lz=0;fov=50;if(gar)speed=6}
 else{tx=px*.75;ty=3.1+(state==='crash'?1.2:0);tz=8.2+speed*.012+(nitroOn?1.2:0);lx=px*.5;ly=1.1;lz=-12;fov=58+Math.min(1,speed/105)*24+(nitroOn?7:0)}
 const kq=Math.min(1,dt*(state==='menu'?3:6));camera.position.x+=(tx-camera.position.x)*kq;camera.position.y+=(ty-camera.position.y)*kq;camera.position.z+=(tz-camera.position.z)*kq;
 camera.position.x+=(Math.random()-.5)*sk;camera.position.y+=(Math.random()-.5)*sk;
 camera.fov+=(fov-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix();camera.lookAt(lx,ly,lz);
 renderer.render(scene,camera);
 drawFX(state==='play'||state==='crash'?speed:0,nitroOn);$('vig').classList.toggle('nit',nitroOn);
 audioUpdate(i);
 if(state==='play'||state==='crash'){setT('kmh',Math.round(speed*3.6));$('sbar').style.width=Math.min(100,speed)+'%';$('nbar').style.width=nitro+'%';setT('sc',score);setT('di',(dist/1000).toFixed(2)+' km');setT('bs',Math.max(S.best,score))}
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(S.hi?Math.min(devicePixelRatio||1,2):1);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();const f=$('fx');f.width=w;f.height=h}
addEventListener('resize',resize);

// ---------- UI wiring ----------
$('bPlay').onclick=startGame;$('oRe').onclick=startGame;
$('bSettings').onclick=()=>{hideAll();show('settings',true)};$('sBack').onclick=()=>{hideAll();show('menu',true)};
$('bGarage').onclick=()=>{hideAll();show('garage',true)};$('gBack').onclick=()=>{hideAll();show('menu',true)};
$('pRes').onclick=togglePause;$('pMenu').onclick=toMenu;$('oMenu').onclick=toMenu;$('bPause').onclick=togglePause;$('bMute').onclick=toggleMute;
$('sVol').value=S.vol;$('sMus').checked=S.music;$('sShd').checked=S.shadows;$('sHi').checked=S.hi;
$('sVol').oninput=e=>{S.vol=+e.target.value;applyVol();save()};$('sMus').onchange=e=>{S.music=e.target.checked;save()};
$('sShd').onchange=e=>{S.shadows=e.target.checked;renderer.shadowMap.enabled=S.shadows;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});save()};
$('sHi').onchange=e=>{S.hi=e.target.checked;resize();save()};
function paint(i){S.color=i;bodyMat.color.setHex(COLORS[i][1]);$('cname').textContent=COLORS[i][0];[...$('sw').children].forEach((b,j)=>b.classList.toggle('on',j===i));save()}
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background='#'+c[1].toString(16).padStart(6,'0');b.setAttribute('aria-label',c[0]);b.onclick=()=>paint(i);$('sw').appendChild(b)});
$('bs').textContent=S.best;paint(S.color);resize();
$('lbar').style.width='100%';$('ltxt').textContent='Ready!';
requestAnimationFrame(t=>{lt=t;loop(t);setTimeout(()=>{$('loading').style.opacity=0;setTimeout(()=>show('loading',false),500);toMenu()},500)});
})();
</script></body></html>
